# SPDX-License-Identifier: GPL-3.0-or-later
#
# Game manifest of The Legend of Zelda: Ocarina of Time (Switch 2): the one file that tells the game-independent build, release
# and launcher code what this game is. Format and readers: recomp/games/pkp/game.toml.
#
# Bring-up state: the module list, hashes and build id are of the dump (NUP package, update 2.0.0); nothing is hooked yet and there
# is no runtime module (runtime/games/oot) or game exe. Values marked "placeholder" are not from the dump.
schema = 1

[game]
id = "oot"
title = "The Legend of Zelda: Ocarina of Time"
short_title = "Ocarina of Time"
product = "Ocarina of Time PC"
title_id = "0400486024DEC000"
version = "2.0.0"                           # the update the module list and hashes are of
platform = "switch2"
languages = 0x1ffff                         # placeholder: every language (the NUP package carries no control.nacp)

[files]
exe = "oot.exe"
runtime_dll = "oot_rt.dll"
ini = "oot.ini"
log = "oot.log"
setup_exe = "oot_setup.exe"
launcher_ini = "oot_launcher.ini"
shader_pack = "shader_cache.ootshc"
save_folder = "OcarinaRecompPC"

[dump]
version = "2.0.0 (update 131072)"
display_version = "2.0.0"                   # placeholder until control.nacp is read (the package has no display version)
main_build_id = "e0f3ccfaf50065ae4ea01eb5aeb13b1a45da3348"
example_folder = "OcarinaOfTime_v2.0.0"

# sha256 of every exefs file as dumped (main is ZBIC-compressed: tools/extract nx_plain_nso makes the plain NSO the lifter reads)
[[dump.file]]
name = "main"
sha256 = "7db9ddfda088c22d219ef13496decd7077c68cd67d4b37f53f4ac46a082768f2"
[[dump.file]]
name = "sdk"
sha256 = "3ae3cd4cf340d72bdaba9e6f66016a74c1eae13737a5f7299375ed6654b9b1c5"
[[dump.file]]
name = "subsdk0"
sha256 = "0d32c4bdbcfcfa1c4110c37eff18eaf70061a55090b7fedc741a2e37224065ba"
[[dump.file]]
name = "rtld"
sha256 = "219f25ef4a64a704e86dacfeb25d9e8977045f2145e629268b94baf34d5e0bbe"
[[dump.file]]
name = "main.npdm"
sha256 = "94c154d83cbaca00d092958cc2b3a0494d7308fe49de8cb33ece7e9e67303ea7"

# Modules in lifter order (same layout as Pokopia). units: about 45k instructions each (text size / 4 / 45000).
[[module]]
name = "main"
file = "main"
base = 0x7100000000
index = 0
units = 352
sites = "main.sites"
[[module]]
name = "sdk"
file = "sdk"
base = 0x7500000000
index = 1
units = 50
[[module]]
name = "subsdk0"
file = "subsdk0"
base = 0x7600000000
index = 2
units = 4
[[module]]
name = "rtld"
file = "rtld"
base = 0x7700000000
index = 3
units = 1
entry = true

[shaders]
extractor = "generic"
extractor_script = "tools/shaders/scripts/extract_generic.py"

[launcher]
name = "Ocarina Launcher"
window_title = "Ocarina Launcher"
product_name = "OcarinaLauncher"
identifier = "org.oot-recomp.launcher"
package_name = "OcarinaRecomp"
disclaimer = "Nintendo"
