# SPDX-License-Identifier: GPL-3.0-or-later
#
# Game manifest of Pokémon Pokopia: the one file that tells the game-independent build, release and launcher code what this game is.
# Adding a game means a new recomp/games/<id>/ folder with its own game.toml (and config.py, sites, runtime/games/<id>/); no shared
# script, CMake file or launcher source names a game.
#
# Readers: recomp/games/<id>/config.py, recomp/games/<id>/CMakeLists.txt, runtime/games/<id>/CMakeLists.txt (via
# recomp/cmake/GameManifest.cmake), game-build (CMake, scripts, release_b/game_build.py), .weaver/release_b.sh (which copies this
# file next to the launcher in the package as game.toml) and the launcher at run time.
# The CMake reader understands only: [table], [dotted.table], [[array.of.tables]], and "string", integer (also 0x..) and true/false values.
#
# Conventions the code relies on (not repeated here): the runtime game module is runtime/games/<id>/<id>_game.h with
# nxrt_register_game_<id>(); the Info it registers (nxrt/game.h) takes its names from this file; crash reports are
# <exe stem>_crash.txt / _freeze.txt / _fatal.txt next to the exe; the launcher's own settings live in
# %APPDATA%\<launcher.identifier>\launcher.json.
schema = 1

[game]
id = "pkp"                                  # short id: folder names, CMake targets, environment variable prefix (PKP_EXEFS, PKP_GAME), logs
title = "Pokémon Pokopia"                   # the game's own name (log, error boxes, window title of the game)
short_title = "Pokopia"                     # short name in messages
product = "Recomp module: pkp"              # neutral build name (exe properties, shortcuts); never the game's name
window_title = "Pokopia (unofficial recompilation)"   # the game window and its dialogs (empty: title)
title_id = "0400A3A01EE4C000"               # Switch program id
version = "2.0.1"                           # the game version the hooks were found in
platform = "switch2"
languages = 0x1ffff                         # control.nacp SupportedLanguage bits (every language until control.nacp is in the dump)

[files]
exe = "pkp.exe"                             # built on the player's PC next to the launcher
runtime_dll = "pkp_rt.dll"                  # the prebuilt runtime in the package (its import library is <stem>.lib)
ini = "pkp.ini"                             # settings file the launcher writes and the game reads
log = "pkp.log"
setup_exe = "pkp_setup.exe"
launcher_ini = "pkp_launcher.ini"
shader_pack = "shader_cache.pkpshc"
save_folder = "pkp-recomp"                  # under %APPDATA%; also names the one-game-per-folder mutex
old_save_folders = "PokopiaRecompPC"        # earlier save_folder names (";"-separated): moved to save_folder at the first start

[dump]
version = "2.0.1 (update 655360)"           # the supported dump, as shown in the build check
display_version = "2.0.1a"                  # the version name players know (README: "Version ... is required")
main_build_id = "76a489f3bd3642fa5e18bd83d32c98bacc5f7d0e"   # of exefs/main (the first 20 bytes of the NSO's build id field)
example_folder = "Pokopia_v2.0.1a"          # an example dump folder name for messages (also the dev machine's default dump under Downloads)

# sha256 of every exefs file of the supported dump, in the order they are checked. The launcher's dump check wants exactly these files.
[[dump.file]]
name = "main"
sha256 = "8a8ce87b4edfce88c6260da5dd80d6cafc03a761eebc842d7a3476e353a8336f"
[[dump.file]]
name = "sdk"
sha256 = "7c12078e9f853f5d77f395155f7308f264fa6e93fadaeba8dca525f4483c09b2"
[[dump.file]]
name = "subsdk0"
sha256 = "2e91ffc8b6f036ffd34fdb3c3dc280dec80956308e34ea866167650842c9f3be"
[[dump.file]]
name = "rtld"
sha256 = "166d3b75ec5559cd241cbacf03dbf16c267a2cbfc95c33c41ba02d3a03c5616f"
[[dump.file]]
name = "main.npdm"
sha256 = "de024cc0dcdf3480b1fca447344fce0a35f49aaffe842c25e5fb4c6d359d42b4"

# Modules in lifter order. file: the NSO in exefs; base: where the guest maps it (baked into the lifted code); index: NxModule.index;
# units: translation units the lifter writes; sites: hook sites file (relative to this folder). The runtime maps the entry module
# first, then the others in this order.
[[module]]
name = "main"
file = "main"
base = 0x7100000000
index = 0
units = 230
sites = "main.sites"
[[module]]
name = "sdk"
file = "sdk"
base = 0x7500000000
index = 1
units = 45
[[module]]
name = "subsdk0"
file = "subsdk0"
base = 0x7600000000
index = 2
units = 4
[[module]]
name = "rtld"
file = "rtld"
base = 0x7700000000
index = 3
units = 1
entry = true

# extractor: the shader corpus extractor the package stages as tools/shaders/extract_corpus.py (the launcher's setup runs it
# with --romfs --main --out --jobs --progress); extractor_script names its file in the nx checkout:
#   "ktgl"    tools/shaders/ampere/extract_corpus.py     KTGL RDB archives (Pokopia), fastest for KTGL games
#   "generic" tools/shaders/scripts/extract_generic.py   any NVN2 game (signature scan; zstd, zlib, SARC, BNSH, GLSLC, Unreal
#             pak/IoStore). Needs zstandard for zstd romfs files and oozx.dll (tools/shaders/oozx) next to it for Oodle.
[shaders]
# generic: finds 99,248 Pokopia blocks vs ktgl 99,012; 209 of the extra 236 are blocks the game draws (seen in runtime dumps)
extractor = "generic"
extractor_script = "tools/shaders/scripts/extract_generic.py"

[launcher]
name = "Recomp Launcher"                    # headings and the navigation brand (neutral: no game name)
window_title = "Recomp Launcher (pkp)"
product_name = "pkp_launcher"               # the launcher exe in the package is <product_name>.exe
identifier = "org.pkp-recomp.launcher"      # app id: the launcher settings folder under %APPDATA%
package_name = "pkp-recomp"                 # release folder and zip: <package_name>-<version>
disclaimer = "Nintendo, The Pokemon Company, or Koei Tecmo"   # "not affiliated with or endorsed by ..."
