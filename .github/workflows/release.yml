# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the game library release package (tools/release/package.ps1: recomp_library.exe, the shader translator, a bundled Python,
# the game manifests and the player-side game build kit: lifter, Zig, NSO converter, each game's runtime DLL + import library)
# and publishes it as a GitHub release.
#   - push a tag v1.2.3            -> build + release "v1.2.3" (pre-release when the tag has a suffix, e.g. v0.2.0-rc1)
#   - Actions tab, "Run workflow"  -> build; with a version given, also a release (tag created on the chosen commit)
#   - a merged pull request (push to oot-nup or main) -> build + release with the next patch version (highest vX.Y.Z tag
#     + 0.0.1, e.g. v0.3.0 -> v0.3.1); opening or updating a pull request runs nothing
# The package holds no game data and no lifted code (LEGAL.md). A game exe is never part of it: the library builds it on the
# player's PC from their own dump (game-build/release_b/game_build.py).
name: Release

on:
  push:
    tags: ['v*']
    branches: [oot-nup, main]
    paths:
      - 'runtime/**'
      - 'recomp/nxrecomp/**'
      - 'recomp/include/**'
      - 'game-build/**'
      - 'tools/extract/**'
      - 'tools/textures/**'
      - 'tools/release/**'
      - 'tools/shaders/harness/**'
      - 'tools/extract/nup_extract.py'
      - 'tools/shaders/scripts/extract_generic.py'
      - 'tools/shaders/scripts/bnsh_programs.py'
      - 'recomp/games/*/game.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Empty: build only, no release.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # merges queue up: each one gets its own patch version, none is skipped

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      VCPKG_COMMIT: 661e42cd1600603016ced1d76a15359e7dade9f5   # the vcpkg the development machines use (AGENTS.md, machine setup)
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # refs/ryubing (Ryujinx's shader translator, MIT)
          fetch-depth: 1

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = ''
          $rel = 'false'
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}' -replace '^v', ''; $rel = 'true' }
          elseif ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.version }}' -ne '') { $v = '${{ inputs.version }}' -replace '^v', ''; $rel = 'true' }
          elseif ('${{ github.event_name }}' -eq 'push') {
            # a merge into oot-nup/main: the next patch version after the highest plain vX.Y.Z tag (v0.3.0 -> 0.3.1)
            $tags = git ls-remote --tags origin 'v*' | ForEach-Object { ($_ -split '\s+')[1] -replace '^refs/tags/v', '' -replace '\^\{\}$', '' } |
                    Where-Object { $_ -match '^[0-9]+\.[0-9]+\.[0-9]+$' } | Sort-Object -Unique { [version]$_ }
            $last = if ($tags) { [version]($tags | Select-Object -Last 1) } else { [version]'0.0.0' }
            $v = "$($last.Major).$($last.Minor).$($last.Build + 1)"; $rel = 'true'
          }
          else { $v = "0.0.0-ci.${{ github.run_number }}+$('${{ github.sha }}'.Substring(0, 7))" }
          if ($rel -eq 'true' -and $v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$') { throw "not a version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$rel" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, release $rel"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: ilammy/msvc-dev-cmd@v1   # rc.exe, the Windows SDK and the MSVC libraries for clang-cl
        with:
          arch: x64

      - name: Tools
        shell: pwsh
        run: |
          clang-cl --version
          cmake --version
          ninja --version
          dotnet --version
          python --version

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bin
          key: vcpkg-bin-${{ env.VCPKG_COMMIT }}-dav1d-libvpx-opus

      - name: Media libraries (vcpkg dav1d, libvpx, opus; static)
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'vcpkg-bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$bin,readwrite"
          $v = Join-Path $env:GITHUB_WORKSPACE 'tools\vcpkg'      # runtime/cmake/media_deps.cmake looks here
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $v
          git -C $v checkout $env:VCPKG_COMMIT
          & "$v\bootstrap-vcpkg.bat" -disableMetrics
          & "$v\vcpkg.exe" install dav1d:x64-windows-static libvpx:x64-windows-static opus:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }

      - name: ASTC transcoder (tools/textures)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\textures\scripts\fetch_third_party.ps1
          if ($LASTEXITCODE -ne 0) { throw 'fetch_third_party failed' }
          cmake -S tools\textures -B tools\textures\build\release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build tools\textures\build\release
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('tools/shaders/harness/**/*.csproj', 'refs/ryubing/Directory.Packages.props') }}

      - name: Package
        shell: pwsh
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\release\package.ps1
          -Version "${{ steps.ver.outputs.version }}" -Out "${{ runner.temp }}\release" -HostPython python

      - name: Smoke test
        shell: pwsh
        run: |
          $pkg = Get-ChildItem "${{ runner.temp }}\release" -Directory | Where-Object Name -like 'recomp-library-*' | Select-Object -First 1
          foreach ($f in 'recomp_library.exe', 'tools\spirv_harness\spirv_harness.exe', 'tools\python\python.exe',
                         'tools\scripts\nup_extract.py', 'tools\scripts\extract_generic.py', 'tools\scripts\bnsh_programs.py', 'LICENSE',
                         'tools\build\game_build.py', 'tools\build\zig\zig.exe', 'tools\build\nx_plain_nso.exe',
                         'tools\build\recomp\nxrecomp\__main__.py', 'games\oot\sdk\oot_rt.lib', 'games\oot\sdk\stub.cpp',
                         'games\oot\runtime\oot_rt.dll', 'tools\scripts\make_manifest.py', 'games\generic\sdk\generic_rt.lib',
                         'games\generic\runtime\generic_rt.dll') {
            if (-not (Test-Path (Join-Path $pkg.FullName $f))) { throw "missing in the package: $f" }
          }
          if (-not (Get-ChildItem (Join-Path $pkg.FullName 'games') -Recurse -Filter game.toml)) { throw 'no game manifests in the package' }
          & (Join-Path $pkg.FullName 'tools\python\python.exe') -I (Join-Path $pkg.FullName 'tools\scripts\nup_extract.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'nup_extract.py --help failed with the bundled Python' }
          & (Join-Path $pkg.FullName 'tools\python\python.exe') -I (Join-Path $pkg.FullName 'tools\build\game_build.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'game_build.py --help failed with the bundled Python' }
          & (Join-Path $pkg.FullName 'tools\python\python.exe') -I (Join-Path $pkg.FullName 'tools\scripts\make_manifest.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'make_manifest.py --help failed with the bundled Python' }
          # the runtime DLL must carry the AV1 movie decoder, or the game waits forever at its title movie
          if (-not (Select-String -Path (Join-Path $pkg.FullName 'games\oot\runtime\oot_rt.dll') -Pattern 'dav1d' -SimpleMatch -Quiet)) { throw 'oot_rt.dll was built without dav1d' }
          # Nothing from a game may ever be in a release (LEGAL.md): refuse console/game file types outright.
          $bad = Get-ChildItem $pkg.FullName -Recurse -File | Where-Object { $_.Extension -in '.nso', '.nro', '.nca', '.nsp', '.xci', '.nup', '.bfsha', '.bnsh', '.spv', '.keys' -or $_.Name -in 'main', 'sdk', 'rtld', 'main.npdm', 'oot.exe', 'pkp.exe' }
          if ($bad) { throw "game/console files in the package: $($bad.FullName -join ', ')" }
          Write-Host "package ok: $($pkg.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: recomp-library-${{ steps.ver.outputs.version }}
          path: |
            ${{ runner.temp }}\release\*.zip
            ${{ runner.temp }}\release\*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recomp-library-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(needs.build.outputs.version, '-') }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          cat > notes.md <<EOF
          Recomp Library ${VERSION} for Windows x64.

          Unzip and start \`recomp_library.exe\`, then add your own dump of a supported game.
          Add your own dump: a .nup package or a folder with the decrypted game files (exefs and romfs). The first Play
          builds the game program from your dump on your PC (once, 15-40 minutes), prepares the shaders, then starts the game.
          NSP/XCI files are not read: they are encrypted, and this project does not handle keys.

          The package contains no game files, no game code, no game program and no keys (see LEGAL.md). Bundled: the shader
          translator (.NET runtime included), an embeddable Python, Zig and the recompiler for the game build, the runtime
          DLL, and the game manifests.

          SHA-256: \`$(cut -d' ' -f1 dist/*.zip.sha256)\`
          EOF
          flags=(--title "Recomp Library ${VERSION}" --notes-file notes.md)
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "$tag" dist/*.zip dist/*.zip.sha256 --target "${{ github.sha }}" "${flags[@]}"
          fi
