name: Bug report
description: Something is wrong in a game or the library app.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what happened, and where in the game.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit you built
      placeholder: e.g. a1b2c3d
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Windows version
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or F9 bug bundle
      description: Drag in the game log (logs folder of the game's data folder) or the F9 bug bundle from the session where it happened.
