name: Bug report
description: Something is wrong in a game or the library app.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** attach game files, extracted data, save files, shader caches, frame captures or whole bug bundles, and do not
        ask for or share dumps, keys or firmware: such issues are closed and removed. See LEGAL.md.
  - type: checkboxes
    id: ownership
    attributes:
      label: Your copy
      options:
        - label: I own this game and dumped it myself from my own console.
          required: true
        - label: This issue contains no game files, keys, firmware or links to them.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened, and where in the game.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, title ID and version
      description: As the library's game page shows them.
      placeholder: e.g. oot, 0400486024DEC000, 2.0.0
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit you built
      placeholder: e.g. a1b2c3d
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Windows version
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Paste the relevant lines of the game log as text (the logs folder of the game's data folder, or log.txt of an F9
        bug bundle). Text only; leave out the bundle's save, capture and image files.
      render: text
